<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850" role="img" aria-label="InvestHub landing page preview">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#17384a"/>
      <stop offset="0.55" stop-color="#244f64"/>
      <stop offset="1" stop-color="#5e8fa5"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" x2="1">
