      <text x="312" y="88" font-family="Poppins, Arial" font-size="16" font-weight="800" fill="#68a4c4">+ Rs. 50</text>
      <text x="50" y="130" font-family="Poppins, Arial" font-size="17" font-weight="800" fill="#fff">Task Completed</text>
      <text x="302" y="130" font-family="Poppins, Arial" font-size="16" font-weight="800" fill="#68a4c4">+ Rs. 120</text>
      <text x="50" y="172" font-family="Poppins, Arial" font-size="17" font-weight="800" fill="#fff">Referral Bonus</text>
      <text x="302" y="172" font-family="Poppins, Arial" font-size="16" font-weight="800" fill="#68a4c4">+ Rs. 200</text>
