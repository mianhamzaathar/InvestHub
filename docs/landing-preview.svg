    <text x="0" y="427" font-family="Poppins, Arial" font-size="72" font-weight="900" fill="#fff">withdrawals.</text>
    <text x="0" y="500" font-family="Poppins, Arial" font-size="20" fill="#eef8ff">Users complete verified tasks, track wallet growth, invite referrals,</text>
    <text x="0" y="535" font-family="Poppins, Arial" font-size="20" fill="#eef8ff">claim bonuses, and withdraw with clear rules and fraud protection.</text>
