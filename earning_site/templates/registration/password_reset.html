{% extends 'base.html' %}
{% block title %}Reset Password | InvestHub{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card">
      <div class="card-header">
        <h4 class="mb-0">Reset Password</h4>
      </div>
      <div class="card-body">
        <p class="text-muted">Enter your account email and we will send password reset instructions.</p>
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label for="{{ form.email.id_for_label }}" class="form-label">Email address</label>
            {{ form.email }}
          </div>
          <button class="btn btn-primary w-100" type="submit">Send Reset Link</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
