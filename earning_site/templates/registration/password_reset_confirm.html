{% extends 'base.html' %}
{% block title %}Set New Password | InvestHub{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card">
      <div class="card-header">
        <h4 class="mb-0">Set New Password</h4>
      </div>
      <div class="card-body">
        {% if validlink %}
          <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="btn btn-primary w-100" type="submit">Update Password</button>
          </form>
        {% else %}
          <p class="text-danger">This password reset link is invalid or has expired.</p>
          <a href="{% url 'password_reset' %}" class="btn btn-primary">Request New Link</a>
        {% endif %}
      </div>
    </div>
  </div>
</div>
{% endblock %}
