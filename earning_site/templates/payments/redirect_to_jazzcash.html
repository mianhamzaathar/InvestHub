<form method="POST" action="https://sandbox.jazzcash.com.pk/CustomerPortal/transactionmanagement/merchantform/" id="jazzcash-form">
  {% csrf_token %}
  {% for key, value in post_data.items %}
    <input type="hidden" name="{{ key }}" value="{{ value }}">
  {% endfor %}
</form>

<script>
  document.getElementById('jazzcash-form').submit();
</script>
