{% extends 'base.html' %}
{% block content %}
<div class="container">
  <h3>Enter OTP to Activate Plan</h3>
  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label>OTP Code</label>
      <input type="text" class="form-control" name="otp" required>
    </div>
    <button class="btn btn-primary">Verify & Activate</button>
  </form>
</div>
{% endblock %}
